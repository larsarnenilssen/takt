# Kjører testene i tests/ ved hver endring i repoet.
name: Tester
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Playwright og Chromium
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Kjør testene
        run: python -m unittest discover -s tests -v
